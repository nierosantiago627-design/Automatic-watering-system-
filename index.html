<div class="dashboard">
  <h1>Automatic Watering System</h1>
  
  <article class="card">
    <h2>Soil Moisture</h2>
    <div id="moistureVal" class="value">--%</div>
    <p class="status">Connecting to sensor...</p>
  </article>

  <article class="card">
    <h2>Water Pump Control</h2>
    <div id="pumpState" class="status-badge">OFF</div>
    <div class="controls">
      <button id="btnOn" class="btn btn-on">Turn Pump ON</button>
      <button id="btnOff" class="btn btn-off">Turn Pump OFF</button>
    </div>
  </article>
</div>
